site_name: Conectafam Plus
site_description: Technical documentation for the Conectafam Plus Django platform.
site_url: https://Anthony-JCG.github.io/conectafam-plus-docs/
site_author: Conectafam Plus

repo_url: https://github.com/Anthony-JCG/conectafam-plus-docs
repo_name: conectafam-plus-docs
edit_uri: ""

docs_dir: site_docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Applications: Aplicaciones
            Infrastructure: Infraestructura
            Overview: Resumen
            Docker: Docker
            Backups: Backups
            User levels cache: Caché de user levels
            Changelog: Registro de cambios

nav:
  - Home: index.md
  - Applications:
      - core: apps/core/index.md
      - user_levels: apps/user_levels/index.md
      - users: apps/users/index.md
      - main: apps/main/index.md
      - training: apps/training/index.md
      - challenge: apps/challenge/index.md
      - communication: apps/communication/index.md
      - boards: apps/boards/index.md
      - landing: apps/landing/index.md
      - links: apps/links/index.md
      - streaming: apps/streaming/index.md
      - pricing: apps/pricing/index.md
      - keyboard_api: apps/keyboard_api/index.md
  - Infrastructure:
      - Overview: infrastructure/index.md
      - Docker: infrastructure/docker.md
      - Backups: infrastructure/backups.md
      - User levels cache: infrastructure/user-levels-cache.md
  - Changelog: changelog.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Anthony-JCG/conectafam-plus-docs

copyright: Copyright &copy; Conectafam Plus
